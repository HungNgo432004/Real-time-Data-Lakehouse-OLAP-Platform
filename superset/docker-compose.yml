# -----------------------------------------------------------------------
# We don't support docker compose for production environments.
# If you choose to use this type of deployment make sure to
# create you own docker environment file (docker/.env) with your own
# unique random secure passwords and SECRET_KEY.
#
# For verbose logging during development:
# - Set SUPERSET_LOG_LEVEL=debug in docker/.env-local for detailed Superset logs
# -----------------------------------------------------------------------
x-superset-volumes:
  # /app/pythonpath_docker will be appended to the PYTHONPATH in the final container
  &superset-volumes
  - ./docker:/app/docker
  # Only override Jed JSON for vi. Do NOT mount the whole translations dir: the repo has .po but no .mo, and
  # Flask/FAB menu labels need messages.mo from the image; a full mount would drop .mo and revert navbar to English.
  - ./docker-data/superset/home:/app/superset_home
  - ./docker/pythonpath_dev/superset_config.py:/app/pythonpath/superset_config.py
  - ./docker/requirements-local.txt:/app/docker/requirements-local.txt
  - ./assets/custom/favicon.png:/app/superset/static/assets/images/favicon.png
  - ./assets/custom/superset-logo-horiz.png:/app/superset/static/assets/images/superset-logo-horiz.png
  - ./assets/custom/superset.png:/app/superset/static/assets/images/superset.png

services:
  redis:
    image: redis:7
    container_name: superset_cache
    restart: unless-stopped
    volumes:
      - ./docker-data/superset/redis:/data
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  db:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    image: postgres:15
    container_name: superset_db
    restart: unless-stopped
    volumes:
      - ./docker-data/superset/postgres/data:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M

  superset:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    image: apache/superset:latest
    container_name: superset_app
    command: [ "/app/docker/docker-bootstrap.sh", "app-gunicorn" ]
    user: "root"
    restart: unless-stopped
    ports:
      - 18088:8088
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  superset-init:
    container_name: superset_init
    image: apache/superset:latest
    command: [ "/app/docker/docker-init.sh" ]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  superset-worker:
    image: apache/superset:latest
    container_name: superset_worker
    command: [ "/app/docker/docker-bootstrap.sh", "worker" ]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      test: [ "CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME" ]
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M

  superset-worker-beat:
    image: apache/superset:latest
    container_name: superset_worker_beat
    command: [ "/app/docker/docker-bootstrap.sh", "beat" ]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
