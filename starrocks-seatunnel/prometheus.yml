global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
alerting:
  alertmanagers:
  - static_configs:
    - targets: []
    scheme: http
    timeout: 10s
    api_version: v2
scrape_configs:
- job_name: 'seatunnel'
  honor_timestamps: true
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /hazelcast/rest/instance/metrics
  scheme: http
  static_configs:
    - targets:
      - seatunnel-master:5801
      - seatunnel-worker:5801

- job_name: 'starrocks_fe'
  metrics_path: '/metrics'
  static_configs:
    - targets:
      - 'starrocks-fe:8030'

- job_name: 'starrocks_be'
  metrics_path: '/metrics'
  static_configs:
    - targets:
      - 'starrocks-be:8040'